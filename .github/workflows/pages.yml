name: Validate and deploy GitHub Pages

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [main, codex/zip-first-foundation-20261117-063137Z]
  workflow_dispatch:

permissions:
  contents: read

# A pull request must never cancel a production run. Updated PR runs can replace
# older runs for that same PR; main/master publication runs are not cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate existing experience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate demo data
        run: npm run validate:data
      - name: Run unit tests
        run: npm test
      - name: Generate locally served NASA Blue Marble imagery
        run: |
          python3 -m venv /tmp/earth-tiles-env
          /tmp/earth-tiles-env/bin/python -m pip install --quiet numpy==2.3.5 pillow==12.3.0 basemap-data==2.0.0
          /tmp/earth-tiles-env/bin/python scripts/build-earth-tiles.py --output public/earth-tiles --max-zoom 4
      - name: Build for the production project subpath
        run: npm run build -- --base=/CoastGuardInteractive/
      - name: Verify bundled Earth imagery is in the deployed output
        run: |
          test -s dist/earth-tiles/0/0/0.jpg
          test -s dist/earth-tiles/2/1/1.jpg
          test -s dist/earth-tiles/4/8/6.jpg
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify the ZIP-first journey and responsive recovery paths
        run: npm run test:e2e
      - name: Verify production asset paths and browser startup
        run: npm run test:e2e -- --grep @production
        env:
          E2E_PRODUCTION: '1'
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          path: dist

  deploy:
    name: Deploy approved production branch
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
